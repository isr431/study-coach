<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Coach</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #222;
            font-family: system-ui, sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        h1 {
            margin: 0 0 8px;
        }

        p {
            line-height: 1.5;
        }

        section {
            margin-top: 24px;
            padding: 24px;
            background: white;
            border: 1px solid #ddd;
        }

        section h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <main>
        <h1>Study Coach</h1>
        <p>Turn your course material into an ordered study plan.</p>

        <section>
            <h2>Course setup</h2>
            <p>Upload your syllabus to begin building your study journey.</p>
        </section>
    </main>
</body>
</html>
