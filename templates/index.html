<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Study Coach</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #222;
            font-family: system-ui, sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        h1 {
            margin: 0 0 8px;
        }

        p {
            line-height: 1.5;
        }

        section {
            margin-top: 24px;
            padding: 24px;
            background: white;
            border: 1px solid #ddd;
        }

        section h2 {
            margin-top: 0;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            padding: 10px;
            font: inherit;
        }

        input,
        select,
        textarea {
            border: 1px solid #aaa;
        }

        textarea {
            resize: vertical;
        }

        .topic-checkbox {
            width: auto;
            margin: 0 8px 0 0;
            padding: 0;
        }

        button {
            color: white;
            background: #222;
            border: 1px solid #222;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        .error {
            margin-bottom: 0;
            color: #b00020;
        }

        #topic-list {
            padding-left: 24px;
        }

        #topic-list li {
            padding: 8px 0;
        }

        .topic-title {
            display: flex;
            align-items: center;
            font-weight: 600;
        }

        #topic-list p {
            margin: 4px 0 0;
        }

        #coach-answer {
            margin-bottom: 0;
            padding: 12px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <main>
        <h1>Study Coach</h1>
        <p>Turn your course material into an ordered study plan.</p>
        <p id="error" class="error" role="alert" hidden></p>

        <section>
            <h2>Course setup</h2>
            <form id="course-form">
                <label for="course-name">Course name</label>
                <input id="course-name" name="course_name" required>

                <label for="syllabus-file">Syllabus file</label>
                <input
                    id="syllabus-file"
                    name="syllabus_file"
                    type="file"
                    accept=".txt,text/plain"
                    required
                >

                <button type="submit">Generate study plan</button>
            </form>
        </section>

        <section id="study-plan" hidden>
            <h2 id="course-title">Study plan</h2>
            <p id="progress" aria-live="polite"></p>
            <ol id="topic-list"></ol>
        </section>

        <section id="topic-coach" hidden>
            <h2>Topic coach</h2>
            <form id="coach-form">
                <label for="coach-topic">Topic</label>
                <select id="coach-topic" required></select>

                <label for="coach-question">Question</label>
                <textarea id="coach-question" rows="3" required></textarea>

                <button type="submit">Ask</button>
            </form>
            <p id="coach-answer" aria-live="polite" hidden></p>
        </section>
    </main>

    <script>
        const form = document.querySelector("#course-form");
        const errorMessage = document.querySelector("#error");
        const studyPlan = document.querySelector("#study-plan");
        const courseTitle = document.querySelector("#course-title");
        const progressText = document.querySelector("#progress");
        const topicList = document.querySelector("#topic-list");
        const submitButton = form.querySelector("button");
        const topicCoach = document.querySelector("#topic-coach");
        const coachForm = document.querySelector("#coach-form");
        const coachTopic = document.querySelector("#coach-topic");
        const coachQuestion = document.querySelector("#coach-question");
        const coachAnswer = document.querySelector("#coach-answer");
        const coachButton = coachForm.querySelector("button");

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.hidden = false;
            errorMessage.scrollIntoView();
        }

        function updateProgress(progress) {
            progressText.textContent =
                `${progress.completed} of ${progress.total} topics complete ` +
                `(${progress.percentage}%)`;
        }

        function renderState(data) {
            courseTitle.textContent = `${data.course.name} study plan`;
            updateProgress(data.progress);
            topicList.replaceChildren();
            coachTopic.replaceChildren();

            for (const topic of data.topics) {
                const item = document.createElement("li");
                const title = document.createElement("label");
                const checkbox = document.createElement("input");
                const titleText = document.createElement("span");
                const summary = document.createElement("p");

                title.className = "topic-title";
                checkbox.className = "topic-checkbox";
                checkbox.type = "checkbox";
                checkbox.checked = topic.completed;
                titleText.textContent = topic.title;
                summary.textContent = topic.summary;

                checkbox.addEventListener("change", async () => {
                    const completed = checkbox.checked;
                    checkbox.disabled = true;
                    errorMessage.hidden = true;

                    try {
                        const response = await fetch(`/api/topics/${topic.id}`, {
                            method: "PATCH",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({completed})
                        });
                        const result = await response.json();

                        if (!response.ok) {
                            throw new Error(result.error || "Progress could not be saved");
                        }

                        updateProgress(result.progress);
                    } catch (error) {
                        checkbox.checked = !completed;
                        showError(error.message);
                    } finally {
                        checkbox.disabled = false;
                    }
                });

                title.append(checkbox, titleText);
                item.append(title, summary);
                topicList.append(item);

                const option = document.createElement("option");
                option.value = topic.id;
                option.textContent = topic.title;
                coachTopic.append(option);
            }

            studyPlan.hidden = false;
            topicCoach.hidden = false;
        }

        async function loadState() {
            try {
                const response = await fetch("/api/state");
                const data = await response.json();

                if (!response.ok) {
                    throw new Error;
                }

                if (data.course) {
                    renderState(data);
                }
            } catch {
                showError("The saved course could not be loaded");
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorMessage.hidden = true;
            submitButton.disabled = true;
            submitButton.textContent = "Generating...";

            try {
                const response = await fetch("/api/setup", {
                    method: "POST",
                    body: new FormData(form)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "The study plan could not be generated");
                }

                renderState(data);
            } catch (error) {
                showError(error.message);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Generate study plan";
            }
        });

        coachForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorMessage.hidden = true;
            coachAnswer.hidden = true;
            coachButton.disabled = true;
            coachButton.textContent = "Asking...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        topic_id: Number(coachTopic.value),
                        question: coachQuestion.value
                    })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "The explanation could not be generated");
                }

                coachAnswer.textContent = data.answer;
                coachAnswer.hidden = false;
            } catch (error) {
                showError(error.message);
            } finally {
                coachButton.disabled = false;
                coachButton.textContent = "Ask";
            }
        });

        loadState();
    </script>
</body>
</html>
